const CONT_NAMES={AS:"Asia",EU:"Europe",NA:"N. America",SA:"S. America",AF:"Africa",OC:"Oceania"};

const CATS={lived:{label:"🏠 Lived",color:"#FF6B6B",bg:"#FFF0F0"},traveled:{label:"✈️ Traveled",color:"#4ECDC4",bg:"#F0FFFD"},transit:{label:"🔄 Passed Through",color:"#FFD166",bg:"#FFFBF0"}};

// ==========================================================
//  Nominatim Geocoding (replaces manual lookup tables)
// ==========================================================
const NOMINATIM_BASE = "https://nominatim.openstreetmap.org";
const reverseCache = new Map();

// Reverse geocode: lat,lng → { region, country, cc }
async function reverseGeocode(lat, lng) {
  const key = parseFloat(lat).toFixed(3) + "," + parseFloat(lng).toFixed(3);
  if (reverseCache.has(key)) return reverseCache.get(key);
  try {
    const url = `${NOMINATIM_BASE}/reverse?lat=${lat}&lon=${lng}&format=json&addressdetails=1&zoom=10&accept-language=en`;
    const resp = await fetch(url);
    const data = await resp.json();
    const addr = data.address || {};
    const result = {
      region: addr.state || addr.province || addr.state_district || addr.region || "",
      country: addr.country || "",
      cc: (addr.country_code || "").toUpperCase()
    };
    reverseCache.set(key, result);
    return result;
  } catch (e) {
    console.warn("Reverse geocode failed:", e);
    return { region: "", country: "", cc: "" };
  }
}

// Search: query → array of place objects
let searchAbort = null;
async function nominatimSearch(query) {
  if (searchAbort) searchAbort.abort();
  const controller = new AbortController();
  searchAbort = controller;
  const url = `${NOMINATIM_BASE}/search?q=${encodeURIComponent(query)}&format=json&addressdetails=1&limit=12&accept-language=en`;
  const resp = await fetch(url, { signal: controller.signal });
  return resp.json();
}

// Extract the best city-level name from a Nominatim address object
function extractCityName(addr, fallbackName) {
  return addr.city || addr.town || addr.village || addr.hamlet || addr.municipality || fallbackName || "";
}

function formatCoord(lat, lng) {
  lat = parseFloat(lat); lng = parseFloat(lng);
  if (isNaN(lat) || isNaN(lng)) return "";
  const la = Math.abs(lat).toFixed(2) + "°" + (lat >= 0 ? "N" : "S");
  const lo = Math.abs(lng).toFixed(2) + "°" + (lng >= 0 ? "E" : "W");
  return la + ", " + lo;
}

function b64toU8(b64){return Uint8Array.from(atob(b64),c=>c.charCodeAt(0))}
async function decryptToken(password){
  try{
    const salt=b64toU8(CONFIG.ENC_SALT);
    const iv=b64toU8(CONFIG.ENC_IV);
    const data=b64toU8(CONFIG.ENC_TOKEN);
    const enc=new TextEncoder();
    const keyMaterial=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},keyMaterial,{name:"AES-GCM",length:256},false,["decrypt"]);
    const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,data);
    const token=new TextDecoder().decode(decrypted);
    if(token.startsWith("github_pat_"))return token;
    return null;
  }catch(e){return null}
}

// === jsonbin.io API ===
const API_URL=()=>`https://api.jsonbin.io/v3/b/${CONFIG.JSONBIN_BIN_ID}`;
const API_HEADERS=()=>({"Content-Type":"application/json","X-Master-Key":CONFIG.JSONBIN_MASTER_KEY});

async function loadData(){
  try{
    const r=await fetch(API_URL()+"/latest",{headers:API_HEADERS()});
    const d=await r.json();
    if(d.record){
      cities=d.record.cities||[];
      ownerName=d.record.name||"";
    }
  }catch(e){console.error("Load error:",e)}
}

async function saveData(){
  try{
    await fetch(API_URL(),{method:"PUT",headers:API_HEADERS(),body:JSON.stringify({cities,name:ownerName})});
  }catch(e){console.error("Save error:",e)}
}

// === Init (no longer loads cities.json) ===
async function init(){
  const topoRaw = await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(r=>r.json());
  geoData=topoFeature(topoRaw,"countries");
  await loadData();
  document.getElementById("loader").style.display="none";
  document.getElementById("map").style.display="block";
  document.getElementById("panel").style.display="block";
  renderMap();
  updateStats();

  // Search with debounce
  let timer;
  const si=document.getElementById("searchInput");
  si.addEventListener("input",()=>{
    clearTimeout(timer);
    document.getElementById("searchClear").style.display=si.value?"block":"none";
    timer=setTimeout(()=>doSearch(si.value),450);

  });
}

// === TopoJSON ===
function topoFeature(t,name){
  const obj=t.objects[name],tf=t.transform,arcs=t.arcs;
  function dArc(i){const r=i<0,a=arcs[r?~i:i];let x=0,y=0;const p=a.map(([dx,dy])=>{x+=dx;y+=dy;return tf?[x*tf.scale[0]+tf.translate[0],y*tf.scale[1]+tf.translate[1]]:[x,y]});return r?p.reverse():p}
  const ring=idxs=>{let c=[];idxs.forEach(i=>{c=c.concat(dArc(i))});return c};
  const geom=g=>{if(g.type==="Polygon")return{type:"Polygon",coordinates:g.arcs.map(ring)};if(g.type==="MultiPolygon")return{type:"MultiPolygon",coordinates:g.arcs.map(p=>p.map(ring))};return null};
  return{type:"FeatureCollection",features:(obj.geometries||[]).map(g=>({type:"Feature",id:g.id,properties:g.properties||{},geometry:geom(g)})).filter(f=>f.geometry)};
}

// === Map ===
function renderMap(){
  const svg=d3.select("#map"),g=d3.select("#mapG");
  const w=svg.node().clientWidth,h=svg.node().clientHeight;
  proj=d3.geoNaturalEarth1().fitSize([w-20,h-20],{type:"Sphere"}).translate([w/2,h/2]);
  path=d3.geoPath(proj);

  g.selectAll("path.water").data([{type:"Sphere"}]).join("path").attr("class","water").attr("d",path).attr("fill","#E3F2FD");
  g.selectAll("path.graticule").data([d3.geoGraticule10()]).join("path").attr("class","graticule").attr("d",path).attr("fill","none").attr("stroke","#E0E0E0").attr("stroke-width",.3);
  g.selectAll("path.country").data(geoData.features).join("path").attr("class","country").attr("d",path).attr("fill","#C8E6C9").attr("stroke","#fff").attr("stroke-width",.5);

  const zoom=d3.zoom().scaleExtent([1,12]).on("zoom",e=>{
    g.attr("transform",e.transform);zoomTf=e.transform;
    g.selectAll("circle.cm").attr("r",6/e.transform.k).attr("stroke-width",2/e.transform.k);
    g.selectAll("circle.cp").attr("r",10/e.transform.k).attr("stroke-width",1.5/e.transform.k);
  });
  svg.call(zoom);

  svg.on("dblclick.custom",e=>{
    if(!editMode)return;
    e.preventDefault();
    const[mx,my]=d3.pointer(e);
    const coords=proj.invert([(mx-zoomTf.x)/zoomTf.k,(my-zoomTf.y)/zoomTf.k]);
    if(coords)openCityModal(-1,true,{lat:coords[1].toFixed(2),lng:coords[0].toFixed(2),custom:true});
  });

  colorCountries();
  renderMarkers();
}

function colorCountries(){
  if(!geoData)return;
  d3.select("#mapG").selectAll("path.country").attr("fill",d=>{
    for(const c of cities){try{if(d3.geoContains(d.geometry,[c.lng,c.lat]))return"#A5D6A7"}catch{}}
    return"#C8E6C9";
  });
}

function renderMarkers(){
  if(!proj)return;
  const g=d3.select("#mapG"),k=zoomTf.k;
  g.selectAll("circle.cp").remove();
  g.selectAll("circle.cm").remove();

  cities.forEach((c,i)=>{
    const[x,y]=proj([c.lng,c.lat]);
    g.append("circle").attr("class","cp").attr("cx",x).attr("cy",y).attr("r",10/k)
      .attr("fill","none").attr("stroke",CATS[c.cat].color).attr("stroke-width",1.5/k).attr("opacity",.4).style("animation","pulse 2s infinite");
    const m=g.append("circle").attr("class","cm").attr("cx",x).attr("cy",y).attr("r",6/k)
      .attr("fill",CATS[c.cat].color).attr("stroke","#fff").attr("stroke-width",2/k)
      .style("cursor","pointer").style("filter","drop-shadow(0 1px 2px rgba(0,0,0,0.3))")
      .on("mouseenter",()=>{showTooltip(c,x,y)}).on("mouseleave",()=>hideTooltip());
    if(editMode)m.on("click",()=>openCityModal(i,false));
    else m.on("click",null);
  });
}

// === Tooltip (uses Nominatim reverse geocoding with cache) ===
function showTooltip(c,mx,my){
  const tt=document.getElementById("tooltip");
  const rect=document.getElementById("map").getBoundingClientRect();
  const px=zoomTf.applyX(mx)+rect.left, py=zoomTf.applyY(my)+rect.top;

  const img=document.getElementById("ttImg");
  if(c.photo){img.src=c.photo;img.style.display="block"}else img.style.display="none";
  document.getElementById("ttDot").style.background=CATS[c.cat]?.color;
  document.getElementById("ttName").textContent=c.name;

  // Build meta line: use stored region if available, otherwise fetch
  const catLabel = CATS[c.cat]?.label || "";
  const buildMeta = (region) => {
    const parts = [];
    if (region) parts.push(region);
    if (c.country) parts.push(c.country);
    parts.push(catLabel);
    return parts.join(" · ");
  };

  document.getElementById("ttMeta").textContent = buildMeta(c.region || "");

  // If no stored region, fetch asynchronously and update tooltip in place
  if (!c.region && c.lat && c.lng) {
    reverseGeocode(c.lat, c.lng).then(info => {
      if (info.region && tt.style.display !== "none") {
        document.getElementById("ttMeta").textContent = buildMeta(info.region);
      }
    }).catch(() => {});
  }

  // Coordinates
  const coordStr = formatCoord(c.lat, c.lng);
  const ttCoords = document.getElementById("ttCoords");
  if (coordStr) { ttCoords.textContent = coordStr; ttCoords.style.display = "block"; }
  else { ttCoords.style.display = "none"; }

  const desc=document.getElementById("ttDesc");
  if(c.desc){desc.textContent=c.desc;desc.style.display="block"}else desc.style.display="none";

  tt.style.left=(px+12)+"px";tt.style.top=(py-10)+"px";tt.style.display="block";
}

function hideTooltip(){document.getElementById("tooltip").style.display="none"}

// === Stats ===
function updateStats(){
  const cn=new Set(cities.map(c=>c.country||c.cc).filter(Boolean));
  document.getElementById("stTotal").textContent=cities.length;
  document.getElementById("stCountries").textContent=cn.size;
  document.getElementById("stLived").textContent=cities.filter(c=>c.cat==="lived").length;
  document.getElementById("stTraveled").textContent=cities.filter(c=>c.cat==="traveled").length;
  document.getElementById("stTransit").textContent=cities.filter(c=>c.cat==="transit").length;
  const extra=document.getElementById("extraStats");
  if(cities.length===0){extra.style.display="none";return}
  extra.style.display="block";
  updateGroupTags();
  updateExtremes();
}

function updateGroupTags(){
  const map={};
  cities.forEach(c=>{
    const cc=c.cc||"";const cd=CDATA[cc];
    if(groupBy==="continent"){const cont=cd?(CONT_NAMES[cd.cont]||cd.cont):"Other";map[cont]=(map[cont]||0)+1}
    else{const cn=c.country||cd?.name||cc||"Unknown";map[cn]=(map[cn]||0)+1}
  });
  const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  document.getElementById("groupTags").innerHTML=sorted.map(([k,v])=>`<span class="tag"><b>${v}</b> ${k}</span>`).join("");
}

function updateExtremes(){
  let n=null,s=null,e=null,w=null;
  cities.forEach(c=>{
    if(!n||c.lat>n.lat)n=c;if(!s||c.lat<s.lat)s=c;
    if(!e||c.lng>e.lng)e=c;if(!w||c.lng<w.lng)w=c;
  });
  const fmt=(v,t)=>{const a=Math.abs(v).toFixed(2);return t==="lat"?`${a}°${v>=0?"N":"S"}`:`${a}°${v>=0?"E":"W"}`};
  let h="";
  if(n)h+=`<span>⬆ <b>${n.name}</b> <span class="coord">${fmt(n.lat,"lat")}</span></span>`;
  if(s)h+=`<span>⬇ <b>${s.name}</b> <span class="coord">${fmt(s.lat,"lat")}</span></span>`;
  if(e)h+=`<span>➡ <b>${e.name}</b> <span class="coord">${fmt(e.lng,"lng")}</span></span>`;
  if(w)h+=`<span>⬅ <b>${w.name}</b> <span class="coord">${fmt(w.lng,"lng")}</span></span>`;
  document.getElementById("extremes").innerHTML=h;
}

function setGroupBy(v){
  groupBy=v;
  document.getElementById("btnContinent").className="tb"+(v==="continent"?" act":"");
  document.getElementById("btnCountry").className="tb"+(v==="country"?" act":"");
  updateGroupTags();
}

  document.getElementById("title").textContent="🌍 "+(ownerName?ownerName+"'s City Footprint":"My City Footprint");
  document.getElementById("nameInput").value=ownerName;
}

// ==========================================================
//  Search (now powered by Nominatim Search API)
// ==========================================================
let searchSeq = 0;   // avoid stale results overwriting newer ones

async function doSearch(q){
  const list=document.getElementById("srList");
  const empty=document.getElementById("srEmpty");
  const loading=document.getElementById("srLoading");

  if(!q||q.length<2){
    list.style.display="none";empty.style.display="none";loading.style.display="none";
    return;
  }

  const seq = ++searchSeq;
  loading.style.display="block";
  list.style.display="none";
  empty.style.display="none";

  try {
    const results = await nominatimSearch(q);

    // Discard if a newer search has started
    if (seq !== searchSeq) return;
    loading.style.display="none";

    if (!results || results.length===0) {
      empty.style.display="block";
      return;
    }

    list.style.display="block";
    list.innerHTML = results.map((r, i) => {
      const lat = parseFloat(r.lat);
      const lng = parseFloat(r.lon);
      const addr = r.address || {};
      const cityName = extractCityName(addr, r.name);
      const region = addr.state || addr.province || addr.state_district || addr.region || "";
      const country = addr.country || "";
      const cc = (addr.country_code || "").toUpperCase();
      const exists = cities.some(c => Math.abs(c.lat-lat)<0.01 && Math.abs(c.lng-lng)<0.01);
      const coordStr = formatCoord(lat, lng);

      let regionLine = "";
      if (region && country) regionLine = region + ", " + country;
      else if (country) regionLine = country;

      return `<div class="sr-item" style="opacity:${exists?.5:1};cursor:${exists?"default":"pointer"}"
        onclick="${exists?"":("addFromSearch("+i+")")}"
        data-idx="${i}" data-lat="${lat}" data-lng="${lng}"
        data-name="${cityName.replace(/"/g,"&quot;")}"
        data-country="${country.replace(/"/g,"&quot;")}"
        data-cc="${cc}"
        data-region="${region.replace(/"/g,"&quot;")}">
        <div style="flex:1;min-width:0">
          <div class="name">${cityName}</div>
          <div class="region">${regionLine}</div>
          <div class="coords">${coordStr}</div>
        </div>
        ${exists?'<span class="added">Added</span>':'<span class="plus">+</span>'}
      </div>`;
    }).join("");

  } catch(e) {
    if (e.name === "AbortError") return;   // cancelled by newer search
    if (seq !== searchSeq) return;
    loading.style.display="none";
    list.style.display="block";
    list.innerHTML='<div style="padding:12px 16px;color:#FF6B6B;font-size:13px">Search request failed. Please try again.</div>';
    console.error("Search error:",e);
  }
}

function addFromSearch(i){
  const el=document.querySelectorAll(".sr-item")[i];
  if(!el)return;
  openCityModal(-1,true,{
    name: el.dataset.name,
    country: el.dataset.country,
    cc: el.dataset.cc,
    region: el.dataset.region,
    lat: parseFloat(el.dataset.lat),
    lng: parseFloat(el.dataset.lng)
  });
  clearSearch();
}

function clearSearch(){
  document.getElementById("searchInput").value="";
  document.getElementById("searchClear").style.display="none";
  document.getElementById("srList").style.display="none";
  document.getElementById("srEmpty").style.display="none";
  document.getElementById("srLoading").style.display="none";
}

// === City Modal ===
function openCityModal(idx,isNew,data){
  modalIdx=idx;modalIsNew=isNew;modalCustom=data?.custom||false;
  const c=isNew?(data||{}):{...cities[idx]};

  document.getElementById("cityModalTitle").textContent=isNew?"✨ Add City":"✏️ Edit City";
  document.getElementById("mName").value=c.name||"";
  document.getElementById("mCountry").value=c.country||"";
  document.getElementById("mLat").value=c.lat||"";
  document.getElementById("mLng").value=c.lng||"";
  document.getElementById("mPhoto").value=c.photo||"";
  document.getElementById("mDesc").value=c.desc||"";
  document.getElementById("mCoordRow").style.display=modalCustom?"block":"none";
  document.getElementById("mDelBtn").style.display=isNew?"none":"inline-block";

  const img=document.getElementById("mPhotoPreview");
  if(c.photo){img.src=c.photo;img.style.display="block"}else img.style.display="none";

  // Reset upload state
  document.getElementById("uploadStatus").style.display="none";
  document.getElementById("uploadBtn").disabled=false;
  document.getElementById("fileInput").value="";

  const cat=c.cat||"traveled";
  document.getElementById("catRow").innerHTML=Object.entries(CATS).map(([k,v])=>
    `<button class="cat-btn${cat===k?" act":""}" style="color:${v.color};border-color:${cat===k?v.color:"#eee"};background:${cat===k?v.bg:"#fff"}" onclick="pickCat('${k}')">${v.label}</button>`
  ).join("");

  document.getElementById("cityOverlay").classList.add("show");
}

function pickCat(k){
  document.querySelectorAll(".cat-btn").forEach(b=>{
    const ck=Object.keys(CATS).find(c=>b.textContent.includes(CATS[c].label.split(" ").slice(1).join(" ")));
    if(!ck)return;
    const isAct=ck===k;
    b.className="cat-btn"+(isAct?" act":"");
    b.style.borderColor=isAct?CATS[ck].color:"#eee";
    b.style.background=isAct?CATS[ck].bg:"#fff";
  });
}

function getSelectedCat(){
  const btn=document.querySelector(".cat-btn.act");
  if(!btn)return"traveled";
  return Object.keys(CATS).find(k=>btn.textContent.includes(CATS[k].label.split(" ").slice(1).join(" ")))||"traveled";
}

function closeCityModal(){document.getElementById("cityOverlay").classList.remove("show")}

function deleteCity(){
  if(!modalIsNew&&modalIdx>=0){cities.splice(modalIdx,1);closeCityModal();refresh();saveData()}

// ==========================================================
//  Photo Upload (compress → GitHub Contents API)
// ==========================================================
function triggerUpload(){
  document.getElementById("fileInput").click();
}

async function handleFileSelect(event){
  const file=event.target.files[0];
  if(!file)return;

  const status=document.getElementById("uploadStatus");
  const btn=document.getElementById("uploadBtn");
  status.style.display="block";
  status.style.color="#999";
  status.textContent="⏳ Compressing image...";
  btn.disabled=true;

  try{
    const base64=await compressImage(file,1200,0.8);
    status.textContent="⏳ Uploading to GitHub...";

    const cityName=document.getElementById("mName").value.trim()||"photo";
    const safeName=cityName.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g,"-").replace(/^-|-$/g,"");
    const filename=safeName+"-"+Date.now()+".jpg";

    const photoUrl=await uploadToGitHub(filename,base64);

    document.getElementById("mPhoto").value=photoUrl;
    const img=document.getElementById("mPhotoPreview");
    // Show local preview immediately (GitHub raw URL may take a moment)
    img.src="data:image/jpeg;base64,"+base64;
    img.style.display="block";

    status.style.color="#4ECDC4";
    status.textContent="✅ Upload complete!";
    setTimeout(()=>{status.style.display="none"},3000);
  }catch(e){
    console.error("Upload error:",e);
    status.style.color="#FF6B6B";
    status.textContent="❌ Upload failed: "+e.message;
  }
  btn.disabled=false;
  event.target.value="";
}

function compressImage(file,maxSize,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        let w=img.width,h=img.height;
        if(w>maxSize||h>maxSize){
          if(w>h){h=Math.round(h*maxSize/w);w=maxSize}
          else{w=Math.round(w*maxSize/h);h=maxSize}
        }
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality).split(",")[1]);
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

async function uploadToGitHub(filename,base64Content){
  if(!githubToken)throw new Error("Not authenticated");
  const[owner,repo]=CONFIG.GITHUB_REPO.split("/");
  const filePath="photos/"+filename;
  const resp=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`,{
    method:"PUT",
    headers:{
      "Authorization":"Bearer "+githubToken,
      "Accept":"application/vnd.github+json",
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      message:"Add travel photo: "+filename,
      content:base64Content
    })
  });
  if(!resp.ok){
    const err=await resp.json();
    throw new Error(err.message||"GitHub API error");
  }
  // Return raw URL (available immediately, no need to wait for Pages deploy)
  return `https://raw.githubusercontent.com/${owner}/${repo}/main/${filePath}`;
}
